;
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cœur de Famille</title>
<style>
body {
  background: #fff5f7;
  font-family: Arial, sans-serif;
  padding: 20px;
  color: #333;
}
.container {
  max-width: 420px;
  margin: 35px auto;
  padding: 25px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 4px 15px #ddd;
}
h1 {
  text-align: center;
  color: #d63384;
}
input, select, button {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #ddd;
}
button {
  background: #d63384;
  color: white;
  border: none;
  font-weight: bold;
}
#message {
  text-align: center;
  margin-top: 15px;
}
</style>
</head>
<body>

<div class="container">
<h1>❤️ Cœur de Famille</h1>
<p>Bienvenue dans notre communauté familiale.</p>

<form id="inscription">
<input id="nom" placeholder="Ton nom complet" required>

<input id="email" type="email"
placeholder="Ton adresse e-mail" required>

<input id="password" type="password"
placeholder="Mot de passe (6 caractères minimum)"
required minlength="6">

<select id="profil" required>
<option value="">Tu es...</option>
<option value="Maman célibataire">Maman célibataire</option>
<option value="Papa célibataire">Papa célibataire</option>
</select>

<select id="ville" required>
<option value="">Ta ville</option>
<option value="Lomé">Lomé</option>
<option value="Baguida">Baguida</option>
<option value="Autre ville du Togo">Autre ville du Togo</option>
</select>

<label>
<input type="checkbox" id="conditions" required
style="width:auto">
J'ai au moins 18 ans et j'accepte les conditions d'utilisation.
</label>

<button type="submit" id="submit">
Créer mon compte
</button>
</form>

<p id="message"></p>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
sendEmailVerification
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "REMPLACE_PAR_TON_API_KEY",
  authDomain: "REMPLACE_PAR_TON_AUTH_DOMAIN",
  projectId: "REMPLACE_PAR_TON_PROJECT_ID",
  storageBucket: "REMPLACE_PAR_TON_STORAGE_BUCKET",
  messagingSenderId: "REMPLACE_PAR_TON_MESSAGING_SENDER_ID",
  appId: "REMPLACE_PAR_TON_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("inscription")
.addEventListener("submit", async (e) => {
  e.preventDefault();

  const message = document.getElementById("message");
  const bouton = document.getElementById("submit");

  bouton.disabled = true;
  message.textContent = "Enregistrement en cours...";

  try {
    const nom = document.getElementById("nom").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const profil = document.getElementById("profil").value;
    const ville = document.getElementById("ville").value;

    const resultat = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await setDoc(doc(db, "users", resultat.user.uid), {
      nom,
      email,
      profil,
      ville,
      dateInscription: serverTimestamp()
    });

    await sendEmailVerification(resultat.user);

    message.style.color = "green";
    message.textContent =
      "Félicitations ! Ton compte est enregistré. Vérifie ton adresse e-mail pour confirmer ton inscription.";

    document.getElementById("inscription").reset();

  } catch (error) {
    message.style.color = "red";
    message.textContent =
      "Erreur de l'enregistrement : " + error.message;
  } finally {
    bouton.disabled = false;
  }
});
</script>

</body>
</html>
